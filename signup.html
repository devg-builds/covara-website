<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Covara Global</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0a08;--ink-2:#12100d;--ivory:#f4efe6;--ivory-dim:rgba(244,239,230,.62);--gold:#d4b174;--gold-bright:#e8cd96;--line:rgba(212,177,116,.16);--serif:"Fraunces",Georgia,serif;--sans:"Manrope",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--ivory);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:clamp(32px,4vw,44px)}
  .logo{font-family:var(--serif);font-size:22px;color:var(--ivory);text-decoration:none;display:inline-block;margin-bottom:28px}
  .logo span{color:var(--gold)}
  h1{font-family:var(--serif);font-weight:450;font-size:28px;margin-bottom:6px}
  p.sub{color:var(--ivory-dim);font-size:14.5px;margin-bottom:28px}
  label{display:block;font-size:13px;color:var(--ivory-dim);margin-bottom:6px;margin-top:16px}
  input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--ivory);font-family:var(--sans);font-size:15px}
  input:focus{outline:none;border-color:var(--gold)}
  button{width:100%;margin-top:24px;background:var(--gold);color:var(--ink);border:none;border-radius:10px;padding:14px;font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer;transition:background .25s}
  button:hover{background:var(--gold-bright)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:16px;font-size:13.5px;min-height:0}
  .msg.err{color:#e58b7a}
  .msg.ok{color:var(--gold-bright)}
  .foot{margin-top:24px;text-align:center;font-size:13.5px;color:var(--ivory-dim)}
  .foot a{color:var(--gold)}
  .back{display:inline-block;margin-bottom:20px;font-size:13px;color:var(--ivory-dim);text-decoration:none}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:44px}
  .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ivory-faint);font-size:12.5px;font-family:var(--sans);padding:4px}
  .pw-toggle:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">Covara<span>.</span></a>
  <a href="index.html" class="back">← Back to site</a>
  <h1>Create your account</h1>
  <p class="sub">Get access to your project dashboard once you're onboarded.</p>
  <form id="signupForm">
    <label>Full name</label>
    <input type="text" name="name" required autocomplete="name">
    <label>Email</label>
    <input type="email" name="email" required autocomplete="email">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" name="password" id="pwField" required minlength="6" autocomplete="new-password">
      <button type="button" class="pw-toggle" id="pwToggle">Show</button>
    </div>
    <button type="submit" id="signupBtn">Create account</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="foot">Already have an account? <a href="login.html">Sign in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  "https://ekqxrttxkntvcqyojfjq.supabase.co",
  "sb_publishable_AYrayKhIpdftrYfyxt9dhA_P3WNxlRZ"
);

document.getElementById("pwToggle").addEventListener("click", () => {
  const f = document.getElementById("pwField");
  const t = document.getElementById("pwToggle");
  const show = f.type === "password";
  f.type = show ? "text" : "password";
  t.textContent = show ? "Hide" : "Show";
});

const form = document.getElementById("signupForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("signupBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg";
  msg.textContent = "";
  btn.disabled = true;
  btn.textContent = "Creating…";
  const { name, email, password } = e.target;
  const { data, error } = await sb.auth.signUp({
    email: email.value.trim(),
    password: password.value,
    options: { data: { full_name: name.value.trim() } },
  });
  btn.disabled = false;
  btn.textContent = "Create account";
  if (error) {
    msg.className = "msg err";
    msg.textContent = error.message;
    return;
  }
  msg.className = "msg ok";
  msg.textContent = data.session
    ? "Account created! Redirecting…"
    : "Account created — check your email to confirm, then sign in.";
  if (data.session) setTimeout(() => (window.location.href = "dashboard.html"), 1200);
});
</script>
</body>
</html>
